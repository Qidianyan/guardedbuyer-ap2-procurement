<meta property="og:type" content="website">
<meta property="og:site_name" content="GuardedBuyer">
<meta property="og:title" content="Approval desk · GuardedBuyer">
<meta property="og:description" content="An AI purchasing agent for small businesses that can only spend inside a signed AP2 mandate: company policy, human approvals, PayPal Orders v2 checkout, delivery checks and PayPal disputes, all in a hash-chained audit log.">
<meta property="og:image" content="https://raw.githubusercontent.com/Qidianyan/guardedbuyer-ap2-procurement/main/web/static/og-card.png">

<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

<link rel="stylesheet" href="/static/approvals.css">
</head>
<body class="desk">
<a class="skip-link" href="#detail">Skip to the selected request</a>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg class="icon"><use href="/static/icons/lucide-sprite.svg#lucide-shield-check"></use></svg></div>
      <div><div class="brand-name">GuardedBuyer</div>
        <div class="brand-sub">Blocked purchases wait here for a human. Approvals become a signed AP2 mandate.</div></div>
    </div>
    <nav class="app-nav" aria-label="Pages">
      <a href="/"><svg class="icon" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#lucide-layout-dashboard"></use></svg><span>Dashboard</span></a>
      <a href="/approvals?demo=1" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#lucide-inbox"></use></svg><span>Approval desk</span></a>
      <a href="/evaluation"><svg class="icon" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#lucide-scale"></use></svg><span>Evaluation</span></a>
    </nav>
    <div class="status-chips">
      <span class="chip" id="mode-chip"><svg class="icon" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#lucide-wallet"></use></svg><span>PayPal</span></span>
      <span class="chip" id="chain-chip"><svg class="icon" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#lucide-link"></use></svg><span>Audit chain</span></span>
      <button class="btn btn-secondary btn-sm" id="load-demo" type="button"><svg class="icon" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#lucide-play"></use></svg>Load demo request</button>
    </div>
  </div>
</header>
<div class="desk-layout">
  <nav class="queue" aria-label="Approval queue">
    <h2 class="queue-title"><svg class="icon" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#lucide-inbox"></use></svg>Queue</h2>
    <ul id="queue-list" class="queue-list"></ul>
    <p class="queue-empty" id="queue-empty">No requests need approval. Use “Load demo request” to create the over-budget laptop request.</p>
  </nav>
  <main id="detail" class="detail" tabindex="-1" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/static/approvals.js"></script>
</body>
</html>
